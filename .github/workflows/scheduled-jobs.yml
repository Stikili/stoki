# Scheduled jobs that hit the app's cron POST routes.
#
# Replaces vercel.json's `crons` block for hosts that don't support Vercel
# cron (Railway, Fly, etc.). The vercel.json file is still the source of
# truth for what's scheduled when — this workflow mirrors it.
#
# Setup (one-time):
#   In GitHub repo settings → Secrets and variables → Actions, add:
#     DEPLOY_URL    — e.g. https://app.stoki.co.za  (no trailing slash)
#     CRON_SECRET   — must match the env var set on the production app
#
# How it works:
#   GitHub fires this workflow at each declared cron time. The dispatcher
#   step inspects github.event.schedule to know which cron triggered the
#   run, then POSTs the matching app routes with the Bearer token.
#
# Manual smoke-test:
#   workflow_dispatch lets you trigger a single route from the Actions
#   tab — useful for confirming the deploy URL + secret combo works
#   before relying on the schedule.

name: scheduled-jobs

on:
  schedule:
    # Daily housekeeping
    - cron: "5 1 * * *"     # post-recurring-expenses
    - cron: "0 2 * * *"     # prune-advisor-conversations
    - cron: "30 6 * * *"    # refresh-market

    # Daily owner-facing pushes
    - cron: "0 6 * * *"     # morning-summary
    - cron: "0 7 * * *"     # margin-erosion + month-end-surge + working-capital-gap
    - cron: "0 8 * * *"     # price-sweet-spot + weather-stock + subscription-retry
    - cron: "0 9 * * *"     # reminders
    - cron: "0 18 * * *"    # daily-summary

    # Hourly
    - cron: "0 * * * *"     # stockout-cost

    # Weekly
    - cron: "0 7 * * 1"     # Mon: dead-stock + tax-threshold
    - cron: "0 7 * * 3"     # Wed: fuel-day

    # Monthly (1st of month)
    - cron: "10 2 1 * *"    # post-monthly-depreciation
    - cron: "0 8 1 * *"     # competitor-proximity

  # Manual trigger from the Actions tab. Use to smoke-test secrets or
  # re-run a missed cron.
  workflow_dispatch:
    inputs:
      route:
        description: "Optional: single route path (e.g. /api/push/daily-summary)"
        required: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch to cron endpoints
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE:    ${{ github.event.schedule }}
          MANUAL:      ${{ github.event.inputs.route }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_URL:-}" ]]; then
            echo "::error::DEPLOY_URL secret not set"; exit 1
          fi
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error::CRON_SECRET secret not set"; exit 1
          fi

          ENDPOINTS=()
          if [[ -n "${MANUAL:-}" ]]; then
            ENDPOINTS+=("$MANUAL")
            echo "Manual dispatch → $MANUAL"
          else
            case "$SCHEDULE" in
              "5 1 * * *")
                ENDPOINTS+=("/api/cron/post-recurring-expenses") ;;
              "0 2 * * *")
                ENDPOINTS+=("/api/cron/prune-advisor-conversations") ;;
              "30 6 * * *")
                ENDPOINTS+=("/api/cron/refresh-market") ;;
              "0 6 * * *")
                ENDPOINTS+=("/api/push/morning-summary") ;;
              "0 7 * * *")
                ENDPOINTS+=("/api/push/margin-erosion")
                ENDPOINTS+=("/api/push/month-end-surge")
                ENDPOINTS+=("/api/push/working-capital-gap") ;;
              "0 8 * * *")
                ENDPOINTS+=("/api/push/price-sweet-spot")
                ENDPOINTS+=("/api/push/weather-stock")
                ENDPOINTS+=("/api/cron/subscription-retry") ;;
              "0 9 * * *")
                ENDPOINTS+=("/api/reminders") ;;
              "0 18 * * *")
                ENDPOINTS+=("/api/push/daily-summary") ;;
              "0 * * * *")
                ENDPOINTS+=("/api/push/stockout-cost") ;;
              "0 7 * * 1")
                ENDPOINTS+=("/api/push/dead-stock")
                ENDPOINTS+=("/api/push/tax-threshold") ;;
              "0 7 * * 3")
                ENDPOINTS+=("/api/push/fuel-day") ;;
              "10 2 1 * *")
                ENDPOINTS+=("/api/cron/post-monthly-depreciation") ;;
              "0 8 1 * *")
                ENDPOINTS+=("/api/push/competitor-proximity") ;;
              *)
                echo "::error::Unknown schedule: $SCHEDULE"
                exit 1 ;;
            esac
          fi

          failed=0
          for path in "${ENDPOINTS[@]}"; do
            url="${DEPLOY_URL}${path}"
            echo "→ POST $url"
            status=$(curl -sS -o /tmp/cron-body -w "%{http_code}" \
              -X POST -H "Authorization: Bearer $CRON_SECRET" "$url" \
              || echo "000")
            echo "  status=$status"
            head -c 500 /tmp/cron-body || true
            echo
            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "::warning::$path returned $status"
              failed=$((failed + 1))
            fi
          done

          if [[ $failed -gt 0 ]]; then
            echo "::error::$failed of ${#ENDPOINTS[@]} endpoints failed"
            exit 1
          fi
